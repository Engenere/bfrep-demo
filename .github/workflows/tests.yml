name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Enquanto a demo usa o main da biblioteca, uma mudança lá pode quebrá-la
  # sem nenhum commit aqui.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Test
        run: pytest

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1
